<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>팀플 매니저 - CAMPUS MATE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="main-header"></header>

  <main class="container">
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px;">
      <div>
        <h1>🤝 다중 팀플 폴더 & 팀원 ID 연동 매니저</h1>
        <p>프로젝트별로 팀 폴더를 나누고, 팀원의 계정 ID를 입력해 초대하면 같은 팀플 보드와 회의록을 공유할 수 있습니다.</p>
      </div>
      <button class="btn" onclick="openNewFolderModal()">📁 + 새 팀플 폴더 만들기</button>
    </div>

    <section id="newFolderBox" class="card" style="display:none; margin-bottom:18px; border:2px solid var(--primary);">
      <div class="card-title">
        <span>📁 새 팀 프로젝트 폴더 생성</span>
        <button class="btn btn-outline btn-sm" onclick="closeNewFolderModal()">닫기</button>
      </div>
      <form id="newFolderForm" class="form-row">
        <input type="text" id="newTeamName" placeholder="프로젝트 폴더명 (예: 자료구조 조별과제)" required style="flex:2;" />
        <select id="newTeamSubject"></select>
        <button type="submit" class="btn">폴더 생성하기</button>
      </form>
    </section>

    <div class="folder-bar" id="folderTabsBar"></div>

    <div id="activeTeamWorkspace">
      <section class="card" style="margin-bottom:20px;">
        <div class="card-title">
          <span id="currentTeamHeader">👥 참여 팀원 관리</span>
          <button class="btn btn-danger btn-sm" onclick="handleDeleteCurrentTeam()">현재 폴더 삭제</button>
        </div>

        <form id="inviteMemberForm" class="form-row" style="margin-bottom:12px;">
          <input type="text" id="inviteUserId" placeholder="초대할 팀원의 계정 ID 입력 (예: student1)" required style="flex:1; max-width:300px;" />
          <button type="submit" id="inviteBtn" class="btn">+ ID로 팀원 초대</button>
        </form>

        <div id="memberChipsArea" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;"></div>
      </section>

      <section class="card" style="margin-bottom:20px;">
        <div class="card-title">📌 팀원별 역할 배정</div>
        <form id="teamTaskForm" class="form-row">
          <select id="tMemberSelect" required style="min-width:160px;"></select>
          <input type="text" id="tDesc" placeholder="담당 역할 및 할 일 내용 입력" required style="flex:2;" />
          <button type="submit" class="btn">역할 배정</button>
        </form>
      </section>

      <div class="grid-3">
        <div class="kanban-col">
          <div class="card-title">📝 할 일 (To Do)</div>
          <div id="col-todo"></div>
        </div>
        <div class="kanban-col">
          <div class="card-title">🔥 진행 중 (Doing)</div>
          <div id="col-doing"></div>
        </div>
        <div class="kanban-col">
          <div class="card-title">✅ 완료 (Done)</div>
          <div id="col-done"></div>
        </div>
      </div>

      <section class="card">
        <div class="card-title">🗒️ 팀 회의록 기록</div>
        <form id="meetingForm" class="form-row">
          <input type="date" id="mDate" required />
          <input type="text" id="mMembers" placeholder="참석자 (예: 이다은, 김민수)" required />
          <input type="text" id="mNote" placeholder="주요 결정 사항 및 회의 내용" required style="flex:2;" />
          <button type="submit" class="btn">회의록 저장</button>
        </form>
        <ul id="meetingList" class="item-list"></ul>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    initCommonUI('team');

    let myTeams = [];
    let selectedTeamId = null;

    function openNewFolderModal() {
      const data = loadData();
      const sel = document.getElementById('newTeamSubject');
      sel.innerHTML = data.subjects.map(s => `<option value="${s.name}">${s.name}</option>`).join('') + '<option value="기타">기타 프로젝트</option>';
      document.getElementById('newFolderBox').style.display = 'block';
    }

    function closeNewFolderModal() {
      document.getElementById('newFolderBox').style.display = 'none';
    }

    async function initTeams() {
      myTeams = await syncMyTeamsFromCloud();
      if (myTeams.length > 0 && !selectedTeamId) {
        selectedTeamId = myTeams[0].id;
      }
      renderAllTeamUI();
    }

    function getCurrentTeam() {
      return myTeams.find(t => t.id === selectedTeamId) || null;
    }

    function selectFolder(teamId) {
      selectedTeamId = teamId;
      renderAllTeamUI();
    }

    function renderAllTeamUI() {
      const folderBar = document.getElementById('folderTabsBar');
      if (myTeams.length === 0) {
        folderBar.innerHTML = '<span style="color:var(--text-sub); font-size:0.9rem;">참여 중인 팀플 폴더가 없습니다. 우측 상단 [+ 새 팀플 폴더 만들기]를 눌러 시작하세요.</span>';
        document.getElementById('activeTeamWorkspace').style.display = 'none';
        return;
      }

      if (!getCurrentTeam()) {
        selectedTeamId = myTeams[0].id;
      }

      document.getElementById('activeTeamWorkspace').style.display = 'block';
      folderBar.innerHTML = myTeams.map(t => `
        <button type="button" class="folder-tab ${t.id === selectedTeamId ? 'active' : ''}" onclick="selectFolder('${t.id}')">
          📁 ${t.name} <span style="font-size:0.75rem; opacity:0.85;">(${t.members.length}명)</span>
        </button>
      `).join('');

      const team = getCurrentTeam();
      document.getElementById('currentTeamHeader').textContent = `👥 [${team.subject || '프로젝트'}] ${team.name} — 참여 팀원 (${team.members.length}명)`;

      const session = getSession();
      const chipsArea = document.getElementById('memberChipsArea');
      chipsArea.innerHTML = team.members.map(m => `
        <span class="member-chip">
          👤 ${m.userName} (${m.userId})
          ${m.userId !== team.ownerId && m.userId !== session.userId ? `<button title="팀원 내보내기" onclick="removeMember('${m.userId}')">×</button>` : ''}
        </span>
      `).join('');

      const memberSelect = document.getElementById('tMemberSelect');
      memberSelect.innerHTML = team.members.map(m => `
        <option value="${m.userId}">${m.userName} (${m.userId})</option>
      `).join('');

      ['todo', 'doing', 'done'].forEach(st => {
        const col = document.getElementById(`col-${st}`);
        const items = (team.tasks || []).filter(t => t.status === st);
        col.innerHTML = items.map(t => `
          <div class="kanban-card">
            <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
              <span class="badge">${t.memberName} (${t.memberId})</span>
              <button class="btn btn-danger" onclick="deleteTeamTask('${t.id}')">×</button>
            </div>
            <p style="font-size:0.92rem; margin-bottom:10px;">${t.task}</p>
            <div style="display:flex; gap:6px;">
              ${st !== 'todo' ? `<button class="btn btn-outline btn-sm" onclick="moveTask('${t.id}', 'todo')">할 일</button>` : ''}
              ${st !== 'doing' ? `<button class="btn btn-outline btn-sm" onclick="moveTask('${t.id}', 'doing')">진행중</button>` : ''}
              ${st !== 'done' ? `<button class="btn btn-outline btn-sm" onclick="moveTask('${t.id}', 'done')">완료</button>` : ''}
            </div>
          </div>
        `).join('') || '<p style="font-size:0.84rem; color:var(--text-sub); text-align:center; padding:20px 0;">항목 없음</p>';
      });

      const mList = document.getElementById('meetingList');
      mList.innerHTML = (team.meetings || []).map(m => `
        <li class="list-item">
          <div>
            <span class="badge">${m.date}</span>
            <strong>참석: ${m.members}</strong> — ${m.note}
          </div>
          <button class="btn btn-danger" onclick="deleteMeeting('${m.id}')">삭제</button>
        </li>
      `).join('') || '<li class="list-item" style="color:var(--text-sub);">등록된 회의록이 없습니다.</li>';
    }

    document.getElementById('newFolderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const session = getSession();
      const name = document.getElementById('newTeamName').value.trim();
      const subject = document.getElementById('newTeamSubject').value;
      if (!name) return;

      const newTeam = {
        id: 'team_' + Date.now(),
        name,
        subject,
        ownerId: session.userId,
        members: [{ userId: session.userId, userName: session.userName }],
        tasks: [],
        meetings: []
      };

      await saveTeamProject(newTeam);
      myTeams.push(newTeam);
      selectedTeamId = newTeam.id;
      e.target.reset();
      closeNewFolderModal();
      renderAllTeamUI();
    });

    document.getElementById('inviteMemberForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const team = getCurrentTeam();
      if (!team) return;

      const inputId = document.getElementById('inviteUserId').value.trim();
      const btn = document.getElementById('inviteBtn');

      if (team.members.some(m => m.userId === inputId)) {
        alert('이미 이 팀플 폴더에 참여 중인 팀원입니다.');
        return;
      }

      btn.disabled = true;
      btn.textContent = '계정 조회 중...';
      const foundUser = await lookupUserById(inputId);
      btn.disabled = false;
      btn.textContent = '+ ID로 팀원 초대';

      if (!foundUser) {
        alert(`'${inputId}' 계정을 찾을 수 없습니다. 상대방이 먼저 회원가입을 완료했는지 확인해 주세요.`);
        return;
      }

      team.members.push(foundUser);
      await saveTeamProject(team);
      document.getElementById('inviteUserId').value = '';
      alert(`${foundUser.userName} (${foundUser.userId}) 님이 팀플 폴더에 추가되었습니다!`);
      renderAllTeamUI();
    });

    async function removeMember(userId) {
      const team = getCurrentTeam();
      if (!team) return;
      if (!confirm('이 팀원을 프로젝트 폴더에서 제외하시겠습니까?')) return;
      team.members = team.members.filter(m => m.userId !== userId);
      await saveTeamProject(team);
      renderAllTeamUI();
    }

    document.getElementById('teamTaskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const team = getCurrentTeam();
      if (!team) return;

      const memberId = document.getElementById('tMemberSelect').value;
      const memberObj = team.members.find(m => m.userId === memberId);
      const taskDesc = document.getElementById('tDesc').value.trim();
      if (!taskDesc || !memberObj) return;

      team.tasks.push({
        id: 'k' + Date.now(),
        memberId: memberObj.userId,
        memberName: memberObj.userName,
        task: taskDesc,
        status: 'todo'
      });

      await saveTeamProject(team);
      document.getElementById('tDesc').value = '';
      renderAllTeamUI();
    });

    async function moveTask(id, status) {
      const team = getCurrentTeam();
      if (!team) return;
      const item = team.tasks.find(t => t.id === id);
      if (item) item.status = status;
      await saveTeamProject(team);
      renderAllTeamUI();
    }

    async function deleteTeamTask(id) {
      const team = getCurrentTeam();
      if (!team) return;
      team.tasks = team.tasks.filter(t => t.id !== id);
      await saveTeamProject(team);
      renderAllTeamUI();
    }

    document.getElementById('meetingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const team = getCurrentTeam();
      if (!team) return;

      team.meetings.unshift({
        id: 'm' + Date.now(),
        date: document.getElementById('mDate').value,
        members: document.getElementById('mMembers').value.trim(),
        note: document.getElementById('mNote').value.trim()
      });

      await saveTeamProject(team);
      e.target.reset();
      renderAllTeamUI();
    });

    async function deleteMeeting(id) {
      const team = getCurrentTeam();
      if (!team) return;
      team.meetings = team.meetings.filter(m => m.id !== id);
      await saveTeamProject(team);
      renderAllTeamUI();
    }

    async function handleDeleteCurrentTeam() {
      const team = getCurrentTeam();
      if (!team) return;
      if (!confirm(`'${team.name}' 팀플 폴더를 삭제하시겠습니까?`)) return;
      await deleteTeamProject(team.id);
      myTeams = myTeams.filter(t => t.id !== team.id);
      selectedTeamId = myTeams.length > 0 ? myTeams[0].id : null;
      renderAllTeamUI();
    }

    initTeams();
  </script>
</body>
</html>
