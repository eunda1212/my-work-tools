<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학점 계산기 - CAMPUS MATE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="main-header"></header>

  <main class="container">
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px;">
      <div>
        <h1>📊 학점 계산</h1>
        <p>학기별 성적과 P/NP 과목, 졸업 이수 학점을 확인하세요.</p>
      </div>
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        <label for="gpaScaleSelect" style="font-weight:700; font-size:0.92rem;">평점 기준:</label>
        <select id="gpaScaleSelect" onchange="onGpaScaleChange(this.value)" style="min-width:115px; font-weight:700;">
          <option value="4.5">4.5 만점</option>
          <option value="4.3">4.3 만점</option>
        </select>

        <label for="semesterFilter" style="font-weight:700; font-size:0.92rem;">조회 학기:</label>
        <select id="semesterFilter" onchange="onSemesterChange(this.value)" style="min-width:150px; font-weight:700;"></select>
      </div>
    </div>

    <div class="grid-2">
      <section class="card">
        <div class="card-title">
          <span id="gpaCardTitle">평점 계산</span>
          <span class="badge" id="overallGpaBadge">전체 누적 평점: 0.00</span>
        </div>
        <div style="margin-bottom:14px;">
          <label style="font-weight:600;">목표 평점 설정: <span id="targetGpaLabel" style="color:var(--primary);">4.00</span> / <span id="gpaScaleDenom">4.5</span></label>
          <input type="range" id="targetGpaSlider" min="2.0" max="4.5" step="0.05" value="4.0" style="width:100%; margin-top:6px;" oninput="updateTargetGpa(this.value)" />
        </div>

        <div class="stat-big" id="currentGpaText">0.00 / 4.50</div>
        <div class="progress-wrap">
          <div class="progress-fill" id="gpaProgressBar" style="width:0%;"></div>
        </div>
        <p id="gpaAdvice" style="font-size:0.9rem; color:var(--text-sub); margin-bottom:16px;"></p>

        <form id="gradeForm" class="form-row">
          <select id="gSemester"></select>
          <input type="text" id="gSubject" placeholder="과목명" required style="flex:2; min-width:130px;" />
          <select id="gCredit">
            <option value="3">3학점</option>
            <option value="2">2학점</option>
            <option value="1">1학점</option>
          </select>
          <select id="gType">
            <option value="전공">전공</option>
            <option value="교양">교양</option>
          </select>
          <select id="gScore">
            <option value="A+">A+ (4.5)</option>
            <option value="A0">A0 (4.0)</option>
            <option value="B+">B+ (3.5)</option>
            <option value="B0">B0 (3.0)</option>
            <option value="C+">C+ (2.5)</option>
            <option value="C0">C0 (2.0)</option>
            <option value="D+">D+ (1.5)</option>
            <option value="D0">D0 (1.0)</option>
            <option value="F">F (0.0)</option>
            <option value="P">P (Pass · 평점제외)</option>
            <option value="NP">NP (Non-Pass · 미이수)</option>
          </select>
          <button type="submit" class="btn">추가</button>
        </form>

        <ul id="gradeList" class="item-list"></ul>
      </section>

      <section class="card">
        <div class="card-title">🎓 졸업 이수 현황</div>
        <p style="font-size:0.88rem; color:var(--text-sub); margin-bottom:14px;">
          전체 학기 취득 학점 기준 달성률입니다.
        </p>

        <form id="gradGoalForm" class="form-row" style="margin-bottom:16px; align-items:center;">
          <label style="font-size:0.82rem; font-weight:700;">총학점
            <input type="number" id="goalTotal" min="1" max="300" style="width:76px; margin-left:4px;" required />
          </label>
          <label style="font-size:0.82rem; font-weight:700;">전공
            <input type="number" id="goalMajor" min="0" max="300" style="width:70px; margin-left:4px;" required />
          </label>
          <label style="font-size:0.82rem; font-weight:700;">교양
            <input type="number" id="goalLiberal" min="0" max="300" style="width:70px; margin-left:4px;" required />
          </label>
          <button type="submit" class="btn btn-sm">기준 저장</button>
        </form>

        <div style="margin-bottom:16px;">
          <div style="display:flex; justify-content:space-between; font-weight:600;">
            <span>총 이수 학점</span>
            <span id="totalCreditStat">0 / 130학점</span>
          </div>
          <div class="progress-wrap"><div class="progress-fill" id="barTotal" style="width:0%;"></div></div>
        </div>

        <div style="margin-bottom:16px;">
          <div style="display:flex; justify-content:space-between; font-weight:600;">
            <span>전공 이수 학점</span>
            <span id="majorCreditStat">0 / 65학점</span>
          </div>
          <div class="progress-wrap"><div class="progress-fill" id="barMajor" style="width:0%;"></div></div>
        </div>

        <div style="margin-bottom:16px;">
          <div style="display:flex; justify-content:space-between; font-weight:600;">
            <span>교양 이수 학점</span>
            <span id="liberalCreditStat">0 / 35학점</span>
          </div>
          <div class="progress-wrap"><div class="progress-fill" id="barLiberal" style="width:0%;"></div></div>
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    initCommonUI('grade');

    function getCurrentScale() {
      const data = loadData();
      return Number(data.gpaScale) === 4.3 ? 4.3 : 4.5;
    }

    function syncGradeOptionLabels(scale) {
      const map = scale === 4.3 ? gradePointMap43 : gradePointMap45;
      const selectEl = document.getElementById('gScore');
      Array.from(selectEl.options).forEach(opt => {
        if (map[opt.value] !== undefined) {
          opt.textContent = `${opt.value} (${map[opt.value].toFixed(1)})`;
        }
      });
    }

    function initSemesterSelectors() {
      const data = loadData();
      const filterSel = document.getElementById('semesterFilter');
      const formSel = document.getElementById('gSemester');

      filterSel.innerHTML = '<option value="ALL">전체 학기 누적</option>' +
        SEMESTERS.map(s => `<option value="${s}">${s}</option>`).join('');
      filterSel.value = data.selectedSemester || '1학년 1학기';

      formSel.innerHTML = SEMESTERS.map(s => `<option value="${s}">${s}</option>`).join('');
      formSel.value = data.selectedSemester || '1학년 1학기';
    }

    function onGpaScaleChange(val) {
      const scale = Number(val) === 4.3 ? 4.3 : 4.5;
      const data = loadData();
      data.gpaScale = scale;
      if (Number(data.targetGpa) > scale) {
        data.targetGpa = scale;
      }
      saveData(data);
      renderGrades();
    }

    function onSemesterChange(val) {
      const data = loadData();
      if (val !== 'ALL') {
        data.selectedSemester = val;
        document.getElementById('gSemester').value = val;
      }
      saveData(data);
      renderGrades();
    }

    function updateTargetGpa(val) {
      const data = loadData();
      data.targetGpa = Number(val);
      saveData(data);
      renderGrades();
    }

    document.getElementById('gradGoalForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = loadData();
      data.gradGoal = {
        ...data.gradGoal,
        total: Math.max(1, Number(document.getElementById('goalTotal').value) || 130),
        major: Math.max(0, Number(document.getElementById('goalMajor').value) || 0),
        liberal: Math.max(0, Number(document.getElementById('goalLiberal').value) || 0)
      };
      saveData(data);
      renderGrades();
    });

    function renderGrades() {
      const data = loadData();
      const scale = getCurrentScale();
      const selectedSem = document.getElementById('semesterFilter').value;
      const target = Math.min(scale, Number(data.targetGpa || 4.0));

      document.getElementById('gpaScaleSelect').value = String(scale);
      document.getElementById('gpaScaleDenom').textContent = scale.toFixed(1);
      syncGradeOptionLabels(scale);

      const slider = document.getElementById('targetGpaSlider');
      slider.max = String(scale);
      slider.value = target;
      document.getElementById('targetGpaLabel').textContent = target.toFixed(2);

      const overallGpa = calculateGPA(data.grades, scale);
      document.getElementById('overallGpaBadge').textContent = `전체 누적 평점: ${overallGpa.toFixed(2)} / ${scale.toFixed(1)}`;

      const filteredGrades = selectedSem === 'ALL'
        ? data.grades
        : data.grades.filter(g => g.semester === selectedSem);

      document.getElementById('gpaCardTitle').textContent = selectedSem === 'ALL'
        ? '전체 누적 평점 시뮬레이터'
        : `${selectedSem} 평점 시뮬레이터`;

      const gpa = calculateGPA(filteredGrades, scale);
      document.getElementById('currentGpaText').textContent = `${gpa.toFixed(2)} / ${scale.toFixed(2)}`;
      const pct = Math.min(100, (gpa / target) * 100);
      document.getElementById('gpaProgressBar').style.width = `${pct}%`;

      const diff = (target - gpa).toFixed(2);
      document.getElementById('gpaAdvice').textContent = diff <= 0
        ? '🎉 축하합니다! 설정한 목표 평점을 달성했습니다.'
        : `목표 평점(${target.toFixed(2)})까지 ${diff}점 더 필요합니다. (P/NP 과목은 평점 산출에서 자동 제외)`;

      const listEl = document.getElementById('gradeList');
      listEl.innerHTML = filteredGrades.map((g) => {
        const realIdx = data.grades.indexOf(g);
        const badgeStyle = g.grade === 'P' ? 'badge-done' : (g.grade === 'NP' || g.grade === 'F' ? 'badge-urgent' : '');
        return `
          <li class="list-item">
            <div>
              <span class="badge">${g.semester}</span>
              <span class="badge">${g.type}</span>
              <strong>${g.subject}</strong> (${g.credit}학점) - <span class="badge ${badgeStyle}">${g.grade}</span>
            </div>
            <button class="btn btn-danger" onclick="deleteGrade(${realIdx})">삭제</button>
          </li>
        `;
      }).join('') || '<li class="list-item" style="color:var(--text-sub);">이 학기에 등록된 성적이 없습니다.</li>';

      const goalTotal = Number(data.gradGoal.total) || 130;
      const goalMajor = Number(data.gradGoal.major) || 65;
      const goalLiberal = Number(data.gradGoal.liberal) || 35;

      if (document.activeElement !== document.getElementById('goalTotal')) {
        document.getElementById('goalTotal').value = goalTotal;
      }
      if (document.activeElement !== document.getElementById('goalMajor')) {
        document.getElementById('goalMajor').value = goalMajor;
      }
      if (document.activeElement !== document.getElementById('goalLiberal')) {
        document.getElementById('goalLiberal').value = goalLiberal;
      }

      const validGrades = data.grades.filter(g => g.grade !== 'F' && g.grade !== 'NP');
      const curTotal = validGrades.reduce((s, g) => s + Number(g.credit), 0) + (data.gradGoal.prevEarned || 0);
      const curMajor = validGrades.filter(g => g.type === '전공').reduce((s, g) => s + Number(g.credit), 0) + (data.gradGoal.prevMajor || 0);
      const curLiberal = validGrades.filter(g => g.type === '교양').reduce((s, g) => s + Number(g.credit), 0) + (data.gradGoal.prevLiberal || 0);

      document.getElementById('totalCreditStat').textContent = `${curTotal} / ${goalTotal}학점`;
      document.getElementById('barTotal').style.width = `${Math.min(100, (curTotal / goalTotal) * 100)}%`;

      document.getElementById('majorCreditStat').textContent = `${curMajor} / ${goalMajor}학점`;
      document.getElementById('barMajor').style.width = `${Math.min(100, (curMajor / goalMajor) * 100)}%`;

      document.getElementById('liberalCreditStat').textContent = `${curLiberal} / ${goalLiberal}학점`;
      document.getElementById('barLiberal').style.width = `${Math.min(100, (curLiberal / goalLiberal) * 100)}%`;
    }

    document.getElementById('gradeForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = loadData();
      const sem = document.getElementById('gSemester').value;
      data.grades.push({
        semester: sem,
        subject: document.getElementById('gSubject').value.trim(),
        credit: Number(document.getElementById('gCredit').value),
        type: document.getElementById('gType').value,
        grade: document.getElementById('gScore').value
      });
      saveData(data);
      document.getElementById('gSubject').value = '';
      if (document.getElementById('semesterFilter').value !== 'ALL') {
        document.getElementById('semesterFilter').value = sem;
      }
      renderGrades();
    });

    function deleteGrade(idx) {
      const data = loadData();
      data.grades.splice(idx, 1);
      saveData(data);
      renderGrades();
    }

    initSemesterSelectors();
    renderGrades();
  </script>
</body>
</html>
