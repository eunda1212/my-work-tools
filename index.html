<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAMPUS MATE - 통합 학업 대시보드</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="main-header"></header>

  <main class="container">
    <div class="page-header">
      <h1 id="welcomeTitle">오늘의 학업 현황 👋</h1>
      <p>수강 과목과 주요 일정을 한눈에 확인하고 바로 이동하세요.</p>
    </div>

    <div class="grid-4">
      <a href="schedule.html" class="card card-link">
        <div class="card-title">📌 남은 과제·시험 <span class="badge">이동 →</span></div>
        <div class="stat-big" id="dash-task-count">0건</div>
        <p style="color:var(--text-sub); font-size:0.88rem;" id="dash-next-task">등록된 일정이 없습니다.</p>
      </a>

      <a href="study.html" class="card card-link">
        <div class="card-title">⏱️ 누적 학습 시간 <span class="badge">이동 →</span></div>
        <div class="stat-big" id="dash-study-time">0분</div>
        <p style="color:var(--text-sub); font-size:0.88rem;">뽀모도로 타이머로 집중 기록</p>
      </a>

      <a href="grade.html" class="card card-link">
        <div class="card-title">📊 전체 누적 평균 평점 <span class="badge">이동 →</span></div>
        <div class="stat-big" id="dash-gpa">0.00</div>
        <p style="color:var(--text-sub); font-size:0.88rem;" id="dash-gpa-goal">목표 평점: 4.00 / 4.5</p>
      </a>

      <a href="team.html" class="card card-link">
        <div class="card-title">🤝 진행 중인 팀플 <span class="badge">이동 →</span></div>
        <div class="stat-big" id="dash-team-count">0건</div>
        <p style="color:var(--text-sub); font-size:0.88rem;">칸반 보드 및 회의록 관리</p>
      </a>
    </div>

    <div class="grid-2">
      <section class="card">
        <div class="card-title">
          <span>📚 내 수강 과목 등록 (학기별 연동)</span>
          <select id="dashSubFilter" onchange="renderDashboard()" style="padding:5px 10px; font-size:0.82rem; font-weight:700;"></select>
        </div>
        <form id="subjectForm" class="form-row">
          <select id="subSemester"></select>
          <input type="text" id="subName" placeholder="과목명 (예: 자료구조)" required style="flex:2; min-width:120px;" />
          <input type="text" id="subProf" placeholder="교수명" style="flex:1; min-width:90px;" />
          <select id="subCredit">
            <option value="3">3학점</option>
            <option value="2">2학점</option>
            <option value="1">1학점</option>
          </select>
          <select id="subType">
            <option value="전공">전공</option>
            <option value="교양">교양</option>
          </select>
          <button type="submit" class="btn">등록</button>
        </form>
        <ul id="subjectList" class="item-list"></ul>
      </section>

      <section class="card">
        <div class="card-title">
          <span>🔥 마감 임박 일정 TOP 3</span>
          <a href="schedule.html" class="btn btn-outline btn-sm">전체보기</a>
        </div>
        <ul id="dashTaskList" class="item-list"></ul>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    initCommonUI('index');

    function initDashSemesters() {
      const data = loadData();
      const subSem = document.getElementById('subSemester');
      const subFilter = document.getElementById('dashSubFilter');
      subSem.innerHTML = SEMESTERS.map(s => `<option value="${s}">${s}</option>`).join('');
      subSem.value = data.selectedSemester || '1학년 1학기';

      subFilter.innerHTML = '<option value="ALL">전체 학기 과목</option>' +
        SEMESTERS.map(s => `<option value="${s}">${s}</option>`).join('');
      subFilter.value = 'ALL';
    }

    function renderDashboard() {
      const session = getSession();
      if (session) {
        document.getElementById('welcomeTitle').textContent = `${session.userName}님 환영합니다! 오늘의 학업 현황입니다 👋`;
      }

      const data = loadData();
      const pendingTasks = data.tasks.filter(t => !t.done).sort((a, b) => new Date(a.due) - new Date(b.due));
      document.getElementById('dash-task-count').textContent = `${pendingTasks.length}건`;
      document.getElementById('dash-next-task').textContent = pendingTasks[0]
        ? `가장 급함: [${pendingTasks[0].subject}] ${pendingTasks[0].title} (${calcDDay(pendingTasks[0].due)})`
        : '등록된 일정이 없습니다.';

      const totalMin = data.studyLogs.reduce((sum, item) => sum + item.minutes, 0);
      document.getElementById('dash-study-time').textContent = `${totalMin}분`;

      const scale = Number(data.gpaScale) === 4.3 ? 4.3 : 4.5;
      const gpa = calculateGPA(data.grades, scale);
      document.getElementById('dash-gpa').textContent = gpa.toFixed(2);
      document.getElementById('dash-gpa-goal').textContent = `목표 평점: ${Math.min(scale, Number(data.targetGpa)).toFixed(2)} / ${scale.toFixed(1)}`;

      const myTeams = getMyTeams();
      const activeTeam = myTeams.reduce((sum, tm) => sum + (tm.tasks || []).filter(t => t.status !== 'done').length, 0);
      document.getElementById('dash-team-count').textContent = `${activeTeam}건`;

      const filterSem = document.getElementById('dashSubFilter').value;
      const visibleSubjects = filterSem === 'ALL'
        ? data.subjects
        : data.subjects.filter(s => (s.semester || '1학년 1학기') === filterSem);

      const subList = document.getElementById('subjectList');
      subList.innerHTML = visibleSubjects.map(s => `
        <li class="list-item">
          <div>
            <span class="badge">${s.semester || '1학년 1학기'}</span>
            <span class="badge">${s.type}</span>
            <strong>${s.name}</strong>
            <span style="color:var(--text-sub); font-size:0.85rem;">(${s.prof || '미지정'} · ${s.credit}학점)</span>
          </div>
          <button class="btn btn-danger" onclick="deleteSubject('${s.id}')">삭제</button>
        </li>
      `).join('') || '<li class="list-item" style="color:var(--text-sub);">해당 학기에 등록된 수강 과목이 없습니다. 위에서 등록해 보세요!</li>';

      const dashTasks = document.getElementById('dashTaskList');
      dashTasks.innerHTML = pendingTasks.slice(0, 3).map(t => `
        <li class="list-item">
          <div>
            <span class="badge badge-urgent">${calcDDay(t.due)}</span>
            <strong>[${t.subject}]</strong> ${t.title}
          </div>
          <span style="font-size:0.82rem; color:var(--text-sub);">${t.due}</span>
        </li>
      `).join('') || '<li class="list-item" style="color:var(--text-sub);">남은 일정이 없습니다 🎉</li>';
    }

    document.getElementById('subjectForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = loadData();
      const semester = document.getElementById('subSemester').value;
      const name = document.getElementById('subName').value.trim();
      const prof = document.getElementById('subProf').value.trim();
      const credit = Number(document.getElementById('subCredit').value);
      const type = document.getElementById('subType').value;
      if (!name) return;

      data.subjects.push({ id: 's' + Date.now(), semester, name, prof, credit, type });
      data.selectedSemester = semester;
      saveData(data);
      document.getElementById('subName').value = '';
      document.getElementById('subProf').value = '';
      initDashSemesters();
    renderDashboard();
    });

    function deleteSubject(id) {
      const data = loadData();
      data.subjects = data.subjects.filter(s => s.id !== id);
      saveData(data);
      initDashSemesters();
    renderDashboard();
    }

    initDashSemesters();
    renderDashboard();
  </script>
</body>
</html>
