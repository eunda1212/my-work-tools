<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시간표 - CAMPUS MATE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="main-header"></header>

  <main class="container">
    <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px;">
      <div>
        <h1>🗓️ 강의 시간표</h1>
        <p>학기별 시간표와 교시 시간을 설정하세요.</p>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <label for="ttSemesterSelect" style="font-weight:700; font-size:0.92rem;">시간표 학기:</label>
        <select id="ttSemesterSelect" onchange="onTtSemesterChange(this.value)" style="min-width:150px; font-weight:700;"></select>
      </div>
    </div>

    <section class="card" style="margin-bottom:20px;">
      <div class="card-title">
        <span>⚙️ 교시 시간 설정</span>
        <span style="font-size:0.82rem; color:var(--text-sub); font-weight:500;">변경 즉시 시간표에 실제 시각이 자동 반영됩니다</span>
      </div>
      <div class="form-row" style="margin-bottom:0; align-items:center;">
        <label style="font-size:0.86rem; font-weight:700;">1교시 시작:</label>
        <select id="cfgStartHour" onchange="updateTimetableConfig()">
          <option value="8">08시</option>
          <option value="9">09시</option>
          <option value="10">10시</option>
        </select>
        <select id="cfgStartMin" onchange="updateTimetableConfig()">
          <option value="0">00분</option>
          <option value="30">30분</option>
        </select>

        <label style="font-size:0.86rem; font-weight:700; margin-left:8px;">1교시 길이:</label>
        <select id="cfgPeriodMin" onchange="updateTimetableConfig()">
          <option value="50">50분 수업</option>
          <option value="60">60분 (1시간)</option>
          <option value="75">75분 수업</option>
        </select>

        <label style="font-size:0.86rem; font-weight:700; margin-left:8px;">표시 교시 수:</label>
        <select id="cfgMaxPeriods" onchange="updateTimetableConfig()">
          <option value="8">8교시까지 (주간)</option>
          <option value="10">10교시까지 (오후/저녁)</option>
          <option value="12">12교시까지 (야간 포함)</option>
          <option value="15">15교시까지 (늦은 야간)</option>
        </select>
      </div>
    </section>

    <div class="grid-2">
      <section class="card" style="grid-column: span 2;">
        <div class="card-title">
          <span id="ttHeaderTitle">🗓️ 주간 강의 시간표</span>
          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <span id="editModeHint" style="font-size:0.8rem; color:var(--text-sub); font-weight:500;">수정 모드를 켜면 과목을 눌러 삭제할 수 있습니다</span>
            <button type="button" id="editModeBtn" class="btn btn-outline btn-sm" onclick="toggleEditMode()">✏️ 수정 모드: 끔</button>
          </div>
        </div>

        <form id="ttForm" class="form-row">
          <select id="ttDay">
            <option value="월">월요일</option>
            <option value="화">화요일</option>
            <option value="수">수요일</option>
            <option value="목">목요일</option>
            <option value="금">금요일</option>
            <option value="토">토요일 (주말/야간)</option>
          </select>
          <select id="ttPeriodStart"></select>
          <span style="align-self:center; font-weight:700;">~</span>
          <select id="ttPeriodEnd"></select>
          <input type="text" id="ttSubject" list="ttSubjectOptions" placeholder="강의명 입력 또는 선택" required style="flex:1.2; min-width:140px;" />
          <datalist id="ttSubjectOptions"></datalist>
          <input type="text" id="ttRoom" placeholder="강의실 (예: 공학관 302)" style="flex:1; min-width:140px;" />
          <button type="submit" class="btn">시간표 추가</button>
        </form>

        <div style="overflow-x:auto;">
          <table class="timetable" id="timetableGrid"></table>
        </div>
      </section>
    </div>

    <section class="card">
      <div class="card-title">☁️ 데이터 백업</div>
      <p style="font-size:0.88rem; color:var(--text-sub); margin-bottom:14px;">
        로그인된 계정의 모든 학습 기록, 학기별 성적·시간표, 팀플 폴더는 자동으로 클라우드 서버와 동기화됩니다.
      </p>
      <div class="form-row" style="margin-bottom:0;">
        <button class="btn" onclick="pushNowToCloud()">⬆️ 서버에 수동 백업</button>
        <button class="btn btn-outline" onclick="pullFromCloud()">⬇️ 서버에서 불러오기</button>
        <button class="btn btn-outline" onclick="exportJSON()">⬇️ JSON 파일 백업</button>
        <input type="file" id="importFile" accept=".json" onchange="importJSON(event)" style="font-size:0.82rem;" />
        <button class="btn btn-danger" onclick="resetAllData()">초기화</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    initCommonUI('tools');

    let isEditMode = false;

    const BLOCK_PALETTE = [
      { bg: '#dce8ff', fg: '#152c5b', border: '#9abbf5' },
      { bg: '#d5f5e3', fg: '#144529', border: '#8ce0b0' },
      { bg: '#fff0bd', fg: '#543b00', border: '#f5cf5b' },
      { bg: '#ffe0e3', fg: '#5c1824', border: '#f59aa6' },
      { bg: '#e8dcff', fg: '#331963', border: '#bea3f5' },
      { bg: '#d4f3f9', fg: '#0f3d4c', border: '#7cd7eb' },
      { bg: '#ffe6cc', fg: '#592d06', border: '#f5b87a' },
      { bg: '#e2f0cb', fg: '#2d470c', border: '#b3d97e' }
    ];

    function toggleEditMode() {
      isEditMode = !isEditMode;
      updateEditModeUI();
      renderTimetable();
    }

    function updateEditModeUI() {
      const btn = document.getElementById('editModeBtn');
      const hint = document.getElementById('editModeHint');
      if (isEditMode) {
        btn.textContent = '✏️ 수정 모드: 켜짐';
        btn.className = 'btn btn-danger btn-sm';
        hint.textContent = '수정 모드가 켜졌습니다: 삭제할 과목 블록을 클릭하세요';
      } else {
        btn.textContent = '✏️ 수정 모드: 끔';
        btn.className = 'btn btn-outline btn-sm';
        hint.textContent = '수정 모드를 켜면 과목을 눌러 삭제할 수 있습니다';
      }
    }

    function initTtPage() {
      const data = loadData();
      const semSel = document.getElementById('ttSemesterSelect');
      semSel.innerHTML = SEMESTERS.map(s => `<option value="${s}">${s}</option>`).join('');
      semSel.value = data.selectedSemester || '1학년 1학기';

      const cfg = data.timetableConfig;
      document.getElementById('cfgStartHour').value = cfg.startHour;
      document.getElementById('cfgStartMin').value = cfg.startMin;
      document.getElementById('cfgPeriodMin').value = cfg.periodMinutes;
      document.getElementById('cfgMaxPeriods').value = cfg.maxPeriods;

      updateEditModeUI();
      populateSubjects();
      populatePeriodSelects();
      renderTimetable();
    }

    function onTtSemesterChange(val) {
      const data = loadData();
      data.selectedSemester = val;
      saveData(data);
      populateSubjects();
      renderTimetable();
    }

    function updateTimetableConfig() {
      const data = loadData();
      data.timetableConfig = {
        startHour: Number(document.getElementById('cfgStartHour').value),
        startMin: Number(document.getElementById('cfgStartMin').value),
        periodMinutes: Number(document.getElementById('cfgPeriodMin').value),
        maxPeriods: Number(document.getElementById('cfgMaxPeriods').value)
      };
      saveData(data);
      populatePeriodSelects();
      renderTimetable();
    }

    function populateSubjects() {
      const data = loadData();
      const currentSem = document.getElementById('ttSemesterSelect').value;
      const dl = document.getElementById('ttSubjectOptions');
      const semSubs = data.subjects.filter(s => (s.semester || '1학년 1학기') === currentSem);
      const list = semSubs.length > 0 ? semSubs : data.subjects;
      dl.innerHTML = list.map(s => `<option value="${s.name}">`).join('');
    }

    function populatePeriodSelects() {
      const data = loadData();
      const cfg = data.timetableConfig;
      const startSel = document.getElementById('ttPeriodStart');
      const endSel = document.getElementById('ttPeriodEnd');

      let opts = '';
      for (let p = 1; p <= cfg.maxPeriods; p++) {
        const timeRange = formatPeriodTime(p, cfg);
        const nightTag = p >= 9 ? ' [야간]' : '';
        opts += `<option value="${p}">${p}교시 (${timeRange})${nightTag}</option>`;
      }
      startSel.innerHTML = opts;
      endSel.innerHTML = opts;
    }

    document.getElementById('ttPeriodStart').addEventListener('change', (e) => {
      const s = Number(e.target.value);
      const endSel = document.getElementById('ttPeriodEnd');
      if (Number(endSel.value) < s) {
        endSel.value = s;
      }
    });

    function buildMergedDayBlocks(day, semEntries, maxPeriods) {
      const blocks = [];
      let p = 1;
      while (p <= maxPeriods) {
        const entry = semEntries.find(item => item.day === day && Number(item.period) === p);
        if (!entry) {
          p++;
          continue;
        }
        const startP = p;
        const periods = [p];
        let nextP = p + 1;
        while (nextP <= maxPeriods) {
          const nextEntry = semEntries.find(item => item.day === day && Number(item.period) === nextP);
          if (
            nextEntry &&
            nextEntry.subject === entry.subject &&
            (nextEntry.room || '') === (entry.room || '')
          ) {
            periods.push(nextP);
            nextP++;
          } else {
            break;
          }
        }
        blocks.push({
          day,
          startPeriod: startP,
          rowspan: periods.length,
          periods,
          subject: entry.subject,
          room: entry.room || ''
        });
        p = nextP;
      }
      return blocks;
    }

    function assignNonOverlappingColors(days, dayBlocksMap, maxPeriods) {
      const cellColorIdx = {};
      const blockColorMap = {};

      days.forEach((day, dIdx) => {
        const blocks = dayBlocksMap[day] || [];
        blocks.forEach((blk, bIdx) => {
          const forbidden = new Set();

          // 같은 요일 직전 블록의 색상 제외
          if (bIdx > 0) {
            const prevKey = `${days[dIdx]}:${blocks[bIdx - 1].startPeriod}`;
            if (blockColorMap[prevKey] !== undefined) {
              forbidden.add(blockColorMap[prevKey]);
            }
          }

          // 왼쪽 인접 요일에서 겹치는 행의 색상 제외
          if (dIdx > 0) {
            const leftDay = days[dIdx - 1];
            blk.periods.forEach(pr => {
              const leftKey = `${leftDay}:${pr}`;
              if (cellColorIdx[leftKey] !== undefined) {
                forbidden.add(cellColorIdx[leftKey]);
              }
            });
          }

          // 과목명 기반 해시를 시작점으로 하되 인접 색상과 겹치지 않는 인덱스 선택
          let hash = 0;
          const seedStr = `${blk.subject}-${day}-${blk.startPeriod}`;
          for (let i = 0; i < seedStr.length; i++) {
            hash = seedStr.charCodeAt(i) + ((hash << 5) - hash);
          }
          const startIdx = Math.abs(hash) % BLOCK_PALETTE.length;

          let chosen = startIdx;
          for (let offset = 0; offset < BLOCK_PALETTE.length; offset++) {
            const candidate = (startIdx + offset) % BLOCK_PALETTE.length;
            if (!forbidden.has(candidate)) {
              chosen = candidate;
              break;
            }
          }

          const key = `${day}:${blk.startPeriod}`;
          blockColorMap[key] = chosen;
          blk.periods.forEach(pr => {
            cellColorIdx[`${day}:${pr}`] = chosen;
          });
        });
      });

      return blockColorMap;
    }

    function renderTimetable() {
      const data = loadData();
      const currentSem = document.getElementById('ttSemesterSelect').value;
      const cfg = data.timetableConfig;
      document.getElementById('ttHeaderTitle').textContent = `🗓️ [${currentSem}] 주간 강의 시간표`;

      const days = ['월', '화', '수', '목', '금', '토'];
      const semEntries = data.timetable.filter(item => item.semester === currentSem);

      const dayBlocksMap = {};
      const blockByStart = {};
      const coveredCells = new Set();

      days.forEach(d => {
        const blocks = buildMergedDayBlocks(d, semEntries, cfg.maxPeriods);
        dayBlocksMap[d] = blocks;
        blocks.forEach(blk => {
          blockByStart[`${d}:${blk.startPeriod}`] = blk;
          for (let i = 1; i < blk.periods.length; i++) {
            coveredCells.add(`${d}:${blk.periods[i]}`);
          }
        });
      });

      const blockColorMap = assignNonOverlappingColors(days, dayBlocksMap, cfg.maxPeriods);

      let html = `<thead><tr><th style="min-width:110px;">교시 / 시간</th>${days.map(d => `<th>${d}</th>`).join('')}</tr></thead><tbody>`;

      for (let p = 1; p <= cfg.maxPeriods; p++) {
        const timeRange = formatPeriodTime(p, cfg);
        const nightBadge = p >= 9 ? ' <span style="font-size:0.7rem; color:var(--accent-coral);">야간</span>' : '';
        html += `<tr>
          <td>
            <strong>${p}교시</strong>${nightBadge}<br>
            <span style="font-size:0.74rem; color:var(--text-sub);">${timeRange}</span>
          </td>`;

        days.forEach(d => {
          const cellKey = `${d}:${p}`;
          if (coveredCells.has(cellKey)) {
            return;
          }

          const blk = blockByStart[cellKey];
          if (blk) {
            const palette = BLOCK_PALETTE[blockColorMap[cellKey] ?? 0];
            const encodedPeriods = encodeURIComponent(JSON.stringify(blk.periods));
            const encodedSubject = encodeURIComponent(blk.subject);
            const rowspanAttr = blk.rowspan > 1 ? ` rowspan="${blk.rowspan}"` : '';
            const editClass = isEditMode ? ' tt-editable' : '';
            const titleAttr = isEditMode
              ? '클릭하여 이 과목 삭제'
              : `${blk.subject} (${blk.periods.length}교시)`;
            const clickAttr = isEditMode
              ? ` onclick="removeMergedBlock('${d}', '${encodedPeriods}', '${encodedSubject}')"`
              : '';

            html += `<td${rowspanAttr} class="tt-filled${editClass}" title="${titleAttr}"${clickAttr} style="background-color:${palette.bg}; color:${palette.fg}; border-color:${palette.border};">
              <div>${blk.subject}</div>
              ${blk.room ? `<div style="font-size:0.75rem; font-weight:400; opacity:0.9;">${blk.room}</div>` : ''}
            </td>`;
          } else {
            html += `<td style="background-color:var(--bg-color);"></td>`;
          }
        });

        html += `</tr>`;
      }
      html += `</tbody>`;
      document.getElementById('timetableGrid').innerHTML = html;
    }

    document.getElementById('ttForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const data = loadData();
      const currentSem = document.getElementById('ttSemesterSelect').value;
      const day = document.getElementById('ttDay').value;
      const pStart = Number(document.getElementById('ttPeriodStart').value);
      const pEnd = Number(document.getElementById('ttPeriodEnd').value);
      const subject = document.getElementById('ttSubject').value.trim();
      const room = document.getElementById('ttRoom').value.trim();
      if (!subject) return;

      const from = Math.min(pStart, pEnd);
      const to = Math.max(pStart, pEnd);

      for (let p = from; p <= to; p++) {
        data.timetable = data.timetable.filter(
          item => !(item.semester === currentSem && item.day === day && Number(item.period) === p)
        );
        data.timetable.push({ semester: currentSem, day, period: p, subject, room });
      }

      saveData(data);
      document.getElementById('ttSubject').value = '';
      document.getElementById('ttRoom').value = '';
      renderTimetable();
    });

    function removeMergedBlock(day, encodedPeriods, encodedSubject) {
      if (!isEditMode) return;
      const periods = JSON.parse(decodeURIComponent(encodedPeriods));
      const subjectName = decodeURIComponent(encodedSubject);
      if (!confirm(`'${day}요일 ${subjectName}' (${periods.join(', ')}교시) 시간표를 삭제하시겠습니까?`)) {
        return;
      }
      const data = loadData();
      const currentSem = document.getElementById('ttSemesterSelect').value;
      const periodSet = new Set(periods.map(Number));
      data.timetable = data.timetable.filter(
        item => !(item.semester === currentSem && item.day === day && periodSet.has(Number(item.period)))
      );
      saveData(data);
      renderTimetable();
    }

    function pushNowToCloud() {
      const session = getSession();
      if (!session || session.userId === 'guest') {
        alert('체험 계정은 서버 백업을 지원하지 않습니다. 회원가입 후 이용해 주세요.');
        return;
      }
      saveData(loadData());
      alert('서버로 현재 계정 데이터를 안전하게 백업했습니다!');
    }

    function exportJSON() {
      const data = loadData();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'campus_mate_backup.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          saveData(parsed);
          alert('데이터가 성공적으로 복원되었습니다!');
          location.reload();
        } catch (err) {
          alert('올바른 JSON 백업 파일이 아닙니다.');
        }
      };
      reader.readAsText(file);
    }

    function resetAllData() {
      const session = getSession();
      if (confirm('현재 계정의 데이터를 초기 상태로 되돌리시겠습니까?')) {
        if (session) localStorage.removeItem(getUserStorageKey(session.userId));
        location.reload();
      }
    }

    initTtPage();
  </script>
</body>
</html>
